# NOTE: The GCP Python buildpack builds this function from a requirements.txt
# generated from the lockfile in this project. We don't want to include
# Antenna's dependencies when we generate the file. See
# bin/build_crash_ping_submitter_zip.sh.

[project]
name = "crash-ping-submitter"
description = "Cloud function that submits Firefox crash pings to Antenna"
version = "1.0.0"  # Required, but unused
requires-python = "==3.11.*"
dependencies = [
    "functions-framework",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# main.py is at the project root, so include that in the path, so we can import
# it in tests.
pythonpath = ["."]

# NOTE: This config duplicates the config in Antenna's pyproject.toml and needs
# to stay in sync with it. This project is linted separately, because its
# directory is excluded from the Antenna Docker image.
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Enable pycodestyle (E), pyflakes (F), bugbear (B), and bandit (S) rules
select = ["E", "F", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
