name: Build, test and push a Docker image

on:
  push:
    branches:
      - main
      - cringe-440
    tags:
      - v20[0-9][0-9].[01][0-9].[0-3][0-9]  # e.g. v2023.12.04
      - v20[0-9][0-9].[01][0-9].[0-3][0-9]-[0-9]  # e.g. v2023.12.04-2
  pull_request:
    branches:
      - main
  merge_group:

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    env:
      # Disable docker compose volume mounts in docker-compose.override.yml
      COMPOSE_FILE: docker-compose.yml
    steps:
      - uses: actions/checkout@v7
      - name: Get info
        run: |
          uname -v
          docker info
      - name: Create version.json
        run: |
          # create a version.json per
          # https://github.com/mozilla-services/Dockerflow/blob/master/docs/version_object.md
          printf '{"commit":"%s","version":"%s","source":"%s","build":"%s"}\n' \
          "$GITHUB_SHA" \
          "$GITHUB_REF_NAME" \
          "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
          "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > version.json
      - name: Output version.json
        run: cat version.json
      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just
      - name: Build Docker images
        run: just build
      - name: Run lint check
        run: just lint
      - name: Run tests
        run: just test
      - name: Run systemtest
        run: |
          just setup
          just run --detach --wait --wait-timeout=10 web nginx
          just shell systemtest/test_env.sh local

      - name: Set Docker image tag to the shortened commit sha for updates of the main branch
        if: github.ref == 'refs/heads/main'
        run: |
          echo IMAGE_TAG=$(git rev-parse --short=10 "$GITHUB_SHA") >> "$GITHUB_ENV"
      - name: Set Docker image tag to the git tag for tagged builds
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo IMAGE_TAG="$GITHUB_REF_NAME" >> "$GITHUB_ENV"
      - name: Set Docker image target name
        if: env.IMAGE_TAG != ''
        run: |
          echo TARGET_IMAGE=us-docker.pkg.dev/${{ secrets.DOCKER_IMAGE_PATH }}:${{ env.IMAGE_TAG }} >> "$GITHUB_ENV"
      - name: Tag Docker image
        if: env.TARGET_IMAGE != ''
        run: |
          docker tag local/antenna_deploy_base:latest "$TARGET_IMAGE"
      - name: Push the Docker image to GAR
        if: env.TARGET_IMAGE != ''
        uses: mozilla-it/deploy-actions/docker-push@v6.7.0
        with:
          image_tags: ${{ env.TARGET_IMAGE }}
          workload_identity_pool_project_number: ${{ secrets.WORKLOAD_IDENTITY_POOL_PROJECT_NUMBER }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

  upload-crash-ping-submitter:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cringe-440'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        # Keep this in step with the uv in the base image that docker/Dockerfile
        # uses.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.9.30"
      - name: Build the crash ping submitter source zip
        run: ./bin/build_crash_ping_submitter_zip.sh
      - name: Get the source tree sha
        run: |
          echo "SOURCE_SHA=$(git rev-parse --short=12 HEAD:crash_ping_submitter)" >> "$GITHUB_ENV"
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ secrets.WORKLOAD_IDENTITY_POOL_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: artifact-writer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Upload the source zip unless that version is already there
        run: |
          object="gs://${{ secrets.CLOUD_FUNCTION_SOURCE_BUCKET_STAGE }}/crash-ping-submitter/${SOURCE_SHA}.zip"
          if gcloud storage objects describe "${object}" > /dev/null 2>&1; then
            echo "Unchanged; ${object} already exists."
          else
            gcloud storage cp \
              --custom-metadata="commit=${GITHUB_SHA},run=${GITHUB_RUN_ID}" \
              dist/crash-ping-submitter.zip "${object}"
          fi
