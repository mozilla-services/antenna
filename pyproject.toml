[project]
name = "Antenna"
description = "The collector component of the Socorro crash ingestion pipeline"
readme = "README.rst"
version = "1.0.0"  # Required, but unused
requires-python = "==3.11.*"
dependencies = [
    "attrs",
    "dockerflow",
    "everett",
    "falcon",
    "fillmore",
    "google-cloud-pubsub",
    "google-cloud-storage",
    "gunicorn",
    "isodate",
    "markus[datadog]",
    "more-itertools",
    "sentry-sdk",
]

[dependency-groups]
dev = [
    "bandit",
    "click",
    "freezegun",
    "obs-common",
    "pytest",
    "requests",
    "ruff",
    "sphinx",
    "sphinx-rtd-theme",
    "urlwait",
    "werkzeug",
]

devcontainer = [
    "ipython",
]

[project.urls]
Homepage = "https://github.com/mozilla-services/antenna"

[tool.uv]
environments = ["""
    sys_platform == 'linux' and
    platform_machine == 'x86_64' and
    implementation_name == 'cpython'
"""]
package = false

[[tool.uv.index]]
name = "cavendish"
url = "https://us-python.pkg.dev/moz-fx-cavendish-prod/cavendish-prod-python/simple/"

[tool.uv.sources]
obs-common = { index = "cavendish" }

# NOTE: The [tool.ruff] config below is duplicated in
# crash_ping_submitter/pyproject.toml, which is linted separately, and the
# two need to stay in sync.
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Enable pycodestyle (E), pyflakes (F), bugbear (B), and bandit (S) rules
select = ["E", "F", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"systemtest/*" = ["S101"]


[tool.pytest.ini_options]
addopts = "-rsxX --tb=native --showlocals"
norecursedirs = [".git", "docs", "bin"]
testpaths = "tests/"

filterwarnings = [
    "error",
    # Google warns about Python 3.11 reaching end of life.
    "ignore:You are using a Python version .*which Google will stop supporting in new releases of google\\.:FutureWarning:google\\.api_core\\._python_version_support",
]


[tool.paul-mclendahand]
github_user = "mozilla-services"
github_project = "antenna"
main_branch = "main"


[tool.release]
github_user = "mozilla-services"
github_project = "antenna"
bugzilla_product = "Socorro"
bugzilla_component = "Infra"
main_branch = "main"
tag_name_template = "v%Y.%m.%d"


[tool.service-status]
main_branch = "main"
hosts = [
    "stage=https://crash-reports.allizom.org",
    "prod=https://crash-reports.mozilla.com",
]
